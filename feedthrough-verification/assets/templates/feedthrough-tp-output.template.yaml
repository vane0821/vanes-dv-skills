feedthrough_tp:
  TP_ID: "FT_A_IF0_TO_B_IF1"
  lifecycle_status: "complete"
  type: "Feedthrough"
  source:
    endpoint: "module_A.IF0"
    clock_domain: "clk_a"
  target:
    endpoint: "module_B.IF1"
    clock_domain: "clk_b"
  signal_mapping:
    - source_signal: "IF0.req"
      target_signal: "IF1.valid"
      value_relation: "IF1.valid == IF0.req"
    - source_signal: "IF0.data"
      target_signal: "IF1.data"
      value_relation: "IF1.data == IF0.data"
  verification_scenario: "IF0.req 有效"
  verification_goal: |-
    在第 1 个 clk_b 有效边沿：
      IF1.valid == IF0.req
      IF1.data == IF0.data
  coverage_strategy: "assertion"
  coverage_strategy_mapping: "PROP_FT_A_IF0_TO_B_IF1"
