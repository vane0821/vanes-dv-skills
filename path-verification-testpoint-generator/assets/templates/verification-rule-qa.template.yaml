    rule_category: "Coverage Sampling"
    rule_purpose: "SRAM_A 边界地址已有覆盖点时避免重复生成代表候选"
    question: "覆盖不足时如何选择代表候选？"
    answer_key: "selection_rule"
    answer: "选取最小与最大边界地址作为代表候选"
    applies_to_path: ""
    applies_to_region: "SRAM_A"
    applies_to_category: "地址映射正确性"
